[mod]
id = "classicfarlands"
version = "1.3.3+mc26.3"
priority = 100

# The noise and density hooks below name raw functions of horizon-core and horizon-world, so this
# bundle is pinned to the Horizon commit whose perlin.rs, density.rs and router.rs it was written
# against. Replace it with the commit of the Nightly you build on and run `native.py check`.
[compatibility]
horizon_revision = "e6eed3e11fd092ac5f0ebdb1fba8fed3c18ccd1c"

# ---- Support modules -------------------------------------------------------------------------

# The mod's Java-translated helpers and its game-side glue (horizon-client).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "port_classicfarlands"
source = "runtime.rs"

[[module]]
id = "game_side"
file = "crates/horizon-client/src/game.rs"
name = "port_classicfarlands_game"
source = "game_side.rs"

# config/classicfarlands.toml: the same file the Fabric mod reads.
[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "port_classicfarlands_config"
source = "farlands_config.rs"

# ClassicFarlands.COORDINATE_DISTANCE / adjustCoordinate. Public: horizon-world and horizon-client
# reach it as horizon_core::noise::port_classicfarlands_state.
[[module]]
id = "state"
file = "crates/horizon-core/src/noise/mod.rs"
name = "port_classicfarlands_state"
source = "farlands_state.rs"
visibility = "pub"

# SmearedPerlinNoiseMixin: the three sampling paths without the coordinate wrap.
[[module]]
id = "noise"
file = "crates/horizon-core/src/noise/perlin.rs"
name = "port_classicfarlands_noise"
source = "farlands_noise.rs"

# DensityJsonUtil and the "Modify Overworld Noise" Mixson event. horizon-world's density.rs has a
# top-level glob import, which horizon-mixins refuses as a destination, so it lives in router.rs.
[[module]]
id = "density"
file = "crates/horizon-world/src/worldgen/router.rs"
name = "port_classicfarlands_density"
source = "farlands_density.rs"
visibility = "pub"

# ---- Options > Mods row -----------------------------------------------------------------------

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# ---- ServerLifecycleEvents.SERVER_STARTING ----------------------------------------------------
# Reads config/classicfarlands.toml and sets the Far Lands distance before any world loads.

[[injection]]
id = "server-starting"
hook = "server_about_to_start"
hook_version = 1
kind = "HEAD"
helper = "server_starting.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ---- SmearedPerlinNoiseMixin ------------------------------------------------------------------
# The Java mixin swaps `wrap(x)`/`wrap(z)` in SmearedPerlinNoise.get for adjustCoordinate, and does
# the same in addToVolume. Horizon's get3 and add_volume reach `wrap` through PerlinNoise helpers
# that plain Perlin noise shares, so a WRAP_OPERATION there would change every noise. The three
# public entry points are replaced instead (OVERWRITE); each is the original body with only the X
# and Z coordinate handling changed, and is identical to it inside the normal range.

[[injection]]
id = "smeared-get2"
target = "horizon_core::noise::perlin::SmearedPerlinNoise::get2"
kind = "OVERWRITE"
helper = "smeared_get2.rs"
bindings = [
  { name = "noise", ty = "&SmearedPerlinNoise", value = "self" },
  { name = "x", ty = "f64", value = "x" },
  { name = "z", ty = "f64", value = "z" },
]

[[injection]]
id = "smeared-get3"
target = "horizon_core::noise::perlin::SmearedPerlinNoise::get3"
kind = "OVERWRITE"
helper = "smeared_get3.rs"
bindings = [
  { name = "noise", ty = "&SmearedPerlinNoise", value = "self" },
  { name = "x", ty = "f64", value = "x" },
  { name = "y", ty = "f64", value = "y" },
  { name = "z", ty = "f64", value = "z" },
]

[[injection]]
id = "smeared-add-to-volume"
target = "horizon_core::noise::perlin::SmearedPerlinNoise::add_to_volume"
kind = "OVERWRITE"
helper = "smeared_add_to_volume.rs"
bindings = [
  { name = "noise", ty = "&SmearedPerlinNoise", value = "self" },
  { name = "buffer", ty = "&mut [f32]", value = "&mut *buffer" },
  { name = "volume", ty = "DensityVolume", value = "volume" },
  { name = "xz_scale", ty = "f64", value = "xz_scale" },
  { name = "y_scale", ty = "f64", value = "y_scale" },
  { name = "amplitude", ty = "f32", value = "amplitude" },
]

# Wraps the three overworld final_density functions so the Far Lands density takes over past the
# switch distance, and adds classicfarlands:farlands_final_density (the Mixson "Modify Overworld
# Noise" event).
#
# This used to be a cancellable HEAD on DensityRegistry::from_json, which horizon-mixins refused
# (E_UNSUPPORTED_SIGNATURE: that function returns Result<Self, DecodeError>). WorldgenOverrides::apply
# takes the bundle and returns a plain BTreeMap<String, String>, runs once per bundle when a world's
# worldgen data loads, and is the one place every density function passes through.
[[injection]]
id = "final-density"
target = "horizon_world::worldgen::overrides::WorldgenOverrides::apply"
kind = "HEAD"
cancellable = true
helper = "final_density.rs"
bindings = [
  { name = "overrides", ty = "&WorldgenOverrides", value = "self" },
  { name = "bundle", ty = "&str", value = "bundle" },
  { name = "base", ty = "&BTreeMap<String, String>", value = "&base" },
]

# ---- Not ported: NoiseChunkMixin.disableAquifers -----------------------------------------------
# @ModifyReturnValue on NoiseBasedChunkGenerator.createFluidPicker. See todo/ and PORTING.md: the
# position-dependent picker it builds has no hookable place in this Horizon commit. The option is
# off by default in the Java mod, so default behaviour is unaffected.
